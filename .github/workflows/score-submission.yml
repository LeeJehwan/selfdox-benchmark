# The submission bot (tools/bot_score.py): scores a team's uploaded test outputs for the
# interim board and comments the total. It never runs submitted code, and the issue text is
# only read from the event file by Python (never put into a shell command).
name: Score submission

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      outputs_url:
        description: "Test outputs zip link, or local:A / local:B (our reference agents)"
        required: true
        default: "local:B"
      team:
        description: "Team name for the dry run"
        required: true
        default: "dryrun"
      dry_run:
        description: "Manual runs are always dry runs (nothing is committed)"
        type: boolean
        default: true

permissions:
  contents: read

# one run per issue at a time (a newer edit replaces a waiting one). Different issues run in
# parallel: the publish step re-reads the board and retries, so their entries never clash.
concurrency:
  group: submission-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  score:
    if: >-
      github.repository == 'LeeJehwan/selfdox-benchmark' &&
      (github.event_name == 'workflow_dispatch' ||
       contains(github.event.issue.labels.*.name, 'submission'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Decrypt the test key
        env:
          TEST_GT_KEY: ${{ secrets.TEST_GT_KEY }}
        run: >-
          openssl enc -d -aes-256-cbc -pbkdf2 -md sha256 -iter 200000 -salt
          -in data/test/gt.json.enc -out "$RUNNER_TEMP/gt.json" -pass env:TEST_GT_KEY

      - name: Score (writes nothing in the repository)
        run: >-
          uv run --no-dev python -m tools.bot_score score --event "$GITHUB_EVENT_PATH"
          --gt "$RUNNER_TEMP/gt.json" --images data/test/images --out "$RUNNER_TEMP/result.json"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/gt.json"

      - name: Publish (push the board first, then the comment text is written)
        if: success() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          uv run --no-dev python -m tools.bot_score publish --result "$RUNNER_TEMP/result.json" \
            --comment "$RUNNER_TEMP/comment.md" --branch "${{ github.event.repository.default_branch }}"

      - name: Comment
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          if [ -s "$RUNNER_TEMP/comment.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"
          elif [ ! -f "$RUNNER_TEMP/comment.md" ]; then
            printf '**SelfDox bot · not scored**\n\nThe bot failed on our side. This does not count as a submission; the organizers will look at it.\n' > "$RUNNER_TEMP/fail.md"
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/fail.md"
          fi

      - name: Dry run
        if: success() && github.event_name == 'workflow_dispatch'
        run: |
          uv run --no-dev python -m tools.bot_score publish --result "$RUNNER_TEMP/result.json" \
            --comment "$RUNNER_TEMP/comment.md" --dry-run --board-out "$RUNNER_TEMP/board.md"
          { echo "## Comment"; cat "$RUNNER_TEMP/comment.md"; echo; echo "## Board (not committed)"; cat "$RUNNER_TEMP/board.md"; } >> "$GITHUB_STEP_SUMMARY"
