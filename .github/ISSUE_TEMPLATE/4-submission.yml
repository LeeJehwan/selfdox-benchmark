name: Submission
description: Hand in your agent and its test outputs. The bot scores the outputs within minutes.
title: "[Submission] team: "
labels: ["submission"]
body:
  - type: markdown
    attributes:
      value: |
        1. Pack with `uv run python -m selfdox.submit --agent <folder> --team <team> ... --model <repo@revision> --test-sub <your test outputs> --smoke 3`. It writes `submission_<team>.zip` (your agent) and `test_outputs_<team>.zip` (your outputs on the 170 test photos).
        2. Attach `submission_<team>.zip` below, and upload `test_outputs_<team>.zip` as a GitHub release asset (it is too big to attach) and paste its link.
        3. The bot comments your 0–100 score within about 10 minutes and puts it on the interim board. **5 submissions per team in total**; the last one before the deadline is the one we run on test and hidden for the final board. The first GitHub account that submits for a team name owns it, and one account submits for one team. Rules: `docs/participants.md`.
  - type: input
    id: team
    attributes: {label: Team name, description: "As it should appear on the leaderboard (letters, digits, spaces, . ( ) - _ ; up to 40)"}
    validations: {required: true}
  - type: input
    id: contact
    attributes: {label: Contact (optional), description: "This issue is public: a GitHub handle is enough. Leave it empty if the organizers already know how to reach you."}
  - type: textarea
    id: models
    attributes:
      label: Models
      description: "Every open-weight model your agent loads, one per line as Hugging Face repo@revision; each at most 4B parameters. Write none if it uses none. Other weight files over 50 MB: <https url>#sha256=<hex> (selfdox.submit --weights)."
      placeholder: "Qwen/Qwen3-VL-4B-Instruct@ebb281e"
    validations: {required: true}
  - type: textarea
    id: tools
    attributes: {label: Other tools (with versions), description: "OCR, detectors, inpainting... and anything you ship in the folder"}
  - type: input
    id: decoding
    attributes: {label: Temperature and seed, placeholder: "temperature 0, seed 0"}
    validations: {required: true}
  - type: textarea
    id: agent_zip
    attributes: {label: Agent zip, description: "Drag submission_<team>.zip here (25 MB at most)"}
    validations: {required: true}
  - type: input
    id: outputs
    attributes: {label: Test outputs link, description: "Download link of test_outputs_<team>.zip (300 MB at most), uploaded as a release asset of a PUBLIC GitHub repository", placeholder: "https://github.com/<you>/<repo>/releases/download/<tag>/test_outputs_<team>.zip"}
    validations: {required: true}
  - type: checkboxes
    id: rules
    attributes:
      label: Checks
      options:
        - label: The agent runs offline from the folder with only the pinned requirements.txt installed (selfdox.submit --smoke passed).
          required: true
        - label: The test outputs come from this agent, unedited; no model was fine-tuned or trained on benchmark photos.
          required: true
