name: Bug in the benchmark
description: The scorer, validator, runner, template or docs do something wrong.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: version
    attributes: {label: Version, description: "Release and scorer version (README, Versions)", placeholder: "v1.0 / scorer 0.3"}
    validations: {required: true}
  - type: textarea
    id: steps
    attributes: {label: What you ran, description: "The exact command, and a photo id if it concerns one photo", render: shell}
    validations: {required: true}
  - type: textarea
    id: got
    attributes: {label: What happened, and what you expected}
    validations: {required: true}
