[project]
name = "selfdox"
version = "1.2.2"
description = "SelfDox: a benchmark for location-leak redaction agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=11.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
tools = [
    "requests>=2.32",
    "imagehash>=4.3",
    "piexif>=1.1.3",
    "opencv-python-headless>=4.10,<5",
    "ocrmac>=1.0; sys_platform == 'darwin'",
    "pillow-heif>=0.18",
    "matplotlib>=3.9",
]
ocr = [
    "easyocr>=1.7.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
# the submission-site scorer (.github/workflows/score-site.yml): pinned, installed from uv.lock
site = [
    "huggingface_hub==0.27.1",
]

[project.scripts]
selfdox-validate = "selfdox.validate:main"
selfdox-score = "selfdox.score:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["selfdox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
